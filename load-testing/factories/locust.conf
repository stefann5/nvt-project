# Locust Configuration for Factory Load Testing
# Student 1 - NVT Project

[runtime settings]
host = http://localhost:8080

[log]
# Log level - DEBUG, INFO, WARNING, ERROR
loglevel = INFO
# Log file
logfile = results/locust.log

[users]
# Default number of users
users = 100
# Spawn rate (users per second)
spawn-rate = 10

# Run time (duration)
# run-time = 5m

[web ui]
# Web UI port
web-port = 8089

[csv]
# Output CSV files prefix
csv = results/factory_load_test
