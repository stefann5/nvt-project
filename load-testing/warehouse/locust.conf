# Locust Configuration for Warehouse Load Testing
# Default settings - can be overridden via command line

# Target host
host = http://localhost:8080

# Default user count and spawn rate
users = 100
spawn-rate = 10

# Run time (use 0 for infinite, or specify like 5m, 10m, 1h)
run-time = 5m

# Output files
csv = results/warehouse_load_test
html = results/warehouse_load_test_report.html

# Logging
loglevel = INFO
logfile = results/warehouse_load_test.log

# Web UI settings (for interactive mode)
# web-host = 127.0.0.1
# web-port = 8089

# Advanced settings
# stop-timeout = 10
