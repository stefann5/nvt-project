<p-toast></p-toast>

<div class="flex justify-content-center p-4">
  <p-card class="w-full" [style]="{'max-width': '1200px'}">
    <ng-template pTemplate="header">
      <div class="flex justify-content-between align-items-center p-3 flex-wrap gap-3">
        <h2 class="m-0">Moje porudzbine</h2>
        <p-button
          label="Nova porudzbina"
          icon="pi pi-plus"
          routerLink="/app/customer/create-order">
        </p-button>
      </div>
    </ng-template>

    <div class="flex justify-content-center p-4" *ngIf="loading">
      <p-progressSpinner strokeWidth="4"></p-progressSpinner>
    </div>

    <p-message severity="info" class="w-full" *ngIf="!loading && orders.length === 0">
      Nemate porudzbina. Kreirajte prvu porudzbinu!
    </p-message>

    <p-table
      [value]="orders"
      [tableStyle]="{'min-width': '50rem'}"
      *ngIf="!loading && orders.length > 0"
      styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>Broj porudzbine</th>
          <th>Firma</th>
          <th>Broj stavki</th>
          <th>Ukupno</th>
          <th>Datum</th>
          <th>Akcije</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-order>
        <tr>
          <td class="font-mono font-semibold">{{ order.orderNumber }}</td>
          <td>{{ order.companyName }}</td>
          <td>{{ order.itemCount }}</td>
          <td class="font-semibold text-primary">{{ formatPrice(order.totalAmount) }}</td>
          <td>{{ formatDate(order.createdAt) }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                icon="pi pi-file-pdf"
                [rounded]="true"
                [text]="true"
                severity="help"
                pTooltip="Preuzmi fakturu"
                (onClick)="downloadInvoice(order.id, order.orderNumber)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>

    <p-paginator
      *ngIf="!loading && totalRecords > 0"
      [rows]="pageSize"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[10, 20, 50]"
      [first]="currentPage * pageSize"
      (onPageChange)="onPageChange($event)">
    </p-paginator>
  </p-card>
</div>
