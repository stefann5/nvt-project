<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="flex justify-content-center p-4">
  <p-card class="w-full" [style]="{'max-width': '1200px'}">
    <ng-template pTemplate="header">
      <div class="flex justify-content-between align-items-center p-3 flex-wrap gap-3">
        <h2 class="m-0">Factories</h2>
        <div class="flex gap-2 align-items-center flex-wrap">
          <p-iconfield>
            <p-inputicon styleClass="pi pi-search"></p-inputicon>
            <input
              pInputText
              [(ngModel)]="searchQuery"
              (input)="onSearch()"
              placeholder="Search factories..."
              class="w-full md:w-auto" />
          </p-iconfield>
          <p-button
            *ngIf="searchQuery"
            icon="pi pi-times"
            [rounded]="true"
            [text]="true"
            (onClick)="clearSearch()">
          </p-button>
          <p-button
            label="Add Factory"
            icon="pi pi-plus"
            routerLink="/app/manager/factories/new">
          </p-button>
        </div>
      </div>
    </ng-template>

    <div class="flex justify-content-center p-4" *ngIf="loading">
      <p-progressSpinner strokeWidth="4"></p-progressSpinner>
    </div>

    <p-message severity="info" class="w-full" *ngIf="!loading && factories.length === 0">
      No factories found.
    </p-message>

    <p-table
      [value]="factories"
      [tableStyle]="{'min-width': '50rem'}"
      *ngIf="!loading && factories.length > 0"
      styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Location</th>
          <th>Products</th>
          <th>Status</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-factory>
        <tr>
          <td class="font-semibold">{{ factory.name }}</td>
          <td>{{ factory.cityName }}, {{ factory.countryName }}</td>
          <td>{{ factory.productCount }}</td>
          <td>
            <p-tag
              [severity]="getStatusSeverity(factory.online)"
              [value]="getStatusLabel(factory.online)">
            </p-tag>
          </td>
          <td>{{ formatDate(factory.createdAt) }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                icon="pi pi-eye"
                [rounded]="true"
                [text]="true"
                pTooltip="View Details"
                [routerLink]="['/app/manager/factories', factory.id]">
              </p-button>
              <p-button
                icon="pi pi-pencil"
                [rounded]="true"
                [text]="true"
                pTooltip="Edit"
                [routerLink]="['/app/manager/factories', factory.id, 'edit']">
              </p-button>
              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                severity="danger"
                pTooltip="Delete"
                (onClick)="confirmDelete(factory)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-4">No factories found.</td>
        </tr>
      </ng-template>
    </p-table>

    <p-paginator
      *ngIf="totalRecords > 0"
      [rows]="pageSize"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[10, 20, 50]"
      (onPageChange)="onPageChange($event)"
      [first]="currentPage * pageSize">
    </p-paginator>
  </p-card>
</div>
