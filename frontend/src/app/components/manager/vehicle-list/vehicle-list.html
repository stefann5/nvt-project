<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="flex justify-content-center p-4">
  <p-card class="w-full" [style]="{'max-width': '1200px'}">
    <ng-template pTemplate="header">
      <div class="flex justify-content-between align-items-center p-3 flex-wrap gap-3">
        <h2 class="m-0">Delivery Vehicles</h2>
        <div class="flex gap-2 align-items-center flex-wrap">
          <p-iconfield>
            <p-inputicon styleClass="pi pi-search"></p-inputicon>
            <input 
              pInputText 
              [(ngModel)]="searchQuery" 
              (input)="onSearch()" 
              placeholder="Search vehicles..." 
              class="w-full md:w-auto" />
          </p-iconfield>
          <p-button 
            *ngIf="searchQuery" 
            icon="pi pi-times" 
            [rounded]="true" 
            [text]="true" 
            (onClick)="clearSearch()">
          </p-button>
          <p-button 
            label="Add Vehicle" 
            icon="pi pi-plus" 
            routerLink="/app/manager/vehicles/new">
          </p-button>
        </div>
      </div>
    </ng-template>

    <div class="flex justify-content-center p-4" *ngIf="loading">
      <p-progressSpinner strokeWidth="4"></p-progressSpinner>
    </div>

    <p-message severity="info" class="w-full" *ngIf="!loading && vehicles.length === 0">
      No vehicles found.
    </p-message>

    <p-table 
      [value]="vehicles" 
      [tableStyle]="{'min-width': '50rem'}" 
      *ngIf="!loading && vehicles.length > 0"
      [paginator]="true" 
      [rows]="10" 
      [rowsPerPageOptions]="[5, 10, 20]"
      styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>License Plate</th>
          <th>Brand</th>
          <th>Model</th>
          <th>Weight Limit (kg)</th>
          <th>Images</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-vehicle>
        <tr>
          <td class="font-semibold">{{ vehicle.licensePlate }}</td>
          <td>{{ vehicle.brandName }}</td>
          <td>{{ vehicle.modelName }}</td>
          <td>{{ vehicle.weightLimit }}</td>
          <td>{{ vehicle.images.length }}</td>
          <td>{{ formatDate(vehicle.createdAt) }}</td>
          <td>
            <div class="flex gap-2">
              <p-button 
                icon="pi pi-pencil" 
                [rounded]="true" 
                [text]="true"
                [routerLink]="['/app/manager/vehicles', vehicle.id, 'edit']">
              </p-button>
              <p-button 
                icon="pi pi-trash" 
                [rounded]="true" 
                [text]="true"
                severity="danger"
                (onClick)="confirmDelete(vehicle)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center p-4">No vehicles found.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
