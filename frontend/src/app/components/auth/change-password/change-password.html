<p-toast position="top-center"></p-toast>
<div class="flex align-items-center justify-content-center min-h-screen px-3">

    <div>
        <!-- Brand Section -->
        <div class="text-center mb-4">
            <i class="pi pi-lock text-6xl mb-3 block" style="color: var(--primary-color);"></i>
            <h1 class="text-4xl font-bold m-0 mb-2">Change Password</h1>
            <p class="text-lg m-0">You must change your password before continuing</p>
        </div>

        <!-- Change Password Card -->
        <p-card class="border-none shadow-4">
            <ng-template pTemplate="content">
                <div class="flex justify-content-center w-full">
                    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="p-fluid" style="min-width: 350px;">

                        <!-- Current Password Field -->
                        <div class="field mb-4">
                            <label for="currentPassword" class="block font-semibold mb-2">
                                <i class="pi pi-key mr-2"></i>Current Password
                            </label>
                            <p-password formControlName="currentPassword" inputId="currentPassword" 
                                placeholder="Enter your current password"
                                class="w-full" inputStyleClass="w-full" 
                                [class.p-invalid]="isCurrentPasswordInvalid"
                                [disabled]="isLoading" [feedback]="false" [toggleMask]="true">
                            </p-password>
                            <small class="p-error block mt-1" *ngIf="isCurrentPasswordInvalid">
                                {{ currentPasswordErrorMessage }}
                            </small>
                        </div>

                        <!-- New Password Field -->
                        <div class="field mb-4">
                            <label for="newPassword" class="block font-semibold mb-2">
                                <i class="pi pi-lock mr-2"></i>New Password
                            </label>
                            <p-password formControlName="newPassword" inputId="newPassword" 
                                placeholder="Enter your new password"
                                class="w-full" inputStyleClass="w-full" 
                                [class.p-invalid]="isNewPasswordInvalid"
                                [disabled]="isLoading" [feedback]="true" [toggleMask]="true">
                            </p-password>
                            <small class="p-error block mt-1" *ngIf="isNewPasswordInvalid">
                                {{ newPasswordErrorMessage }}
                            </small>
                        </div>

                        <!-- Confirm Password Field -->
                        <div class="field mb-4">
                            <label for="confirmPassword" class="block font-semibold mb-2">
                                <i class="pi pi-check-circle mr-2"></i>Confirm New Password
                            </label>
                            <p-password formControlName="confirmPassword" inputId="confirmPassword" 
                                placeholder="Confirm your new password"
                                class="w-full" inputStyleClass="w-full" 
                                [class.p-invalid]="isConfirmPasswordInvalid"
                                [disabled]="isLoading" [feedback]="false" [toggleMask]="true">
                            </p-password>
                            <small class="p-error block mt-1" *ngIf="isConfirmPasswordInvalid">
                                {{ confirmPasswordErrorMessage }}
                            </small>
                        </div>

                        <!-- Submit Button -->
                        <p-button type="submit" label="Change Password" icon="pi pi-check" 
                            class="w-full flex justify-content-center mb-4"
                            [disabled]="changePasswordForm.invalid || isLoading"
                            [loading]="isLoading">
                        </p-button>

                        <!-- Logout Link -->
                        <div class="text-center">
                            <span class="text-500">Want to use a different account? </span>
                            <a class="text-primary cursor-pointer font-semibold no-underline hover:underline" 
                               (click)="logout()">
                                Sign out
                            </a>
                        </div>

                    </form>
                </div>
            </ng-template>
        </p-card>

        <!-- Info Message -->
        <div class="text-center mt-4">
            <p class="text-500 text-sm">
                <i class="pi pi-info-circle mr-1"></i>
                For security reasons, you must change your temporary password.
            </p>
        </div>
    </div>
</div>
