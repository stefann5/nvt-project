spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/smartly
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

application.security.jwt.secret-key=4bb6d1dfbafb64a681139d1586b6f1160d18159afd57c8c79136d7490630407c
application.security.jwt.access-token-expiration=30000000
application.security.jwt.refresh-token-expiration=604800000

spring.mail.host=localhost
spring.mail.port=8025
spring.mail.username=
spring.mail.password=
spring.mail.sender=noreply@smartly.com

server.port=8080
server.ssl.enabled=false
# Disable authentication since it's a local fake server
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

application.front.address.login=http://localhost:4200

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket.company-images=company-images
minio.bucket.company-documents=company-documents
minio.bucket.vehicle-images=vehicle-images

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# InfluxDB Configuration
influxdb.url=http://localhost:8086
influxdb.token=smartly-influx-token
influxdb.org=smartly
influxdb.bucket=vehicle_telemetry

# Vehicle Heartbeat Configuration
vehicle.heartbeat.timeout=60
vehicle.heartbeat.check-interval=15000

# Enable scheduling
spring.task.scheduling.pool.size=5

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# JPA Performance Tuning
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000